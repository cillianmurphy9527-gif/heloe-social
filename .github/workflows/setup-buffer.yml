name: Setup Buffer
# Optional: only needed for the API-key publisher. Channel ids are already filled in config/channels.json.
on: workflow_dispatch
permissions:
  contents: write
jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Discover organization and channels
        env: { BUFFER_API_KEY: "${{ secrets.BUFFER_API_KEY }}" }
        run: python scripts/buffer_setup.py
      - name: Commit
        run: |
          git config user.name "heloe-bot"; git config user.email "bot@users.noreply.github.com"
          git add config/channels.json && git commit -m "buffer: channel ids" || echo "nothing to commit"
          git pull --rebase && git push
